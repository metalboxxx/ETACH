[project]
name = "etach"
version = "0.6.1"
description = "ETACH sidecar: LangGraph pipeline, FastAPI sidecar and the etach CLI."
requires-python = ">=3.12,<3.13"
# Runtime dependencies are pinned when first used (docs/initial-plan/plan.md step 0).
dependencies = [
    "fastapi==0.118.0",
    "httpx==0.28.1",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "uvicorn==0.37.0",
]

[project.scripts]
etach = "etach.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` is on sys.path so tests can import the shared helpers as `support.<module>`.
pythonpath = ["tests"]
# `live` tests need Ollama and the models (teacher's laptop); they are deselected unless `-m live`.
addopts = ["-m", "not live", "--strict-markers", "--import-mode=importlib"]
markers = [
    "live: needs a running Ollama with the models (run with `pytest -m live`)",
]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
